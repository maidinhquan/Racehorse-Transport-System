services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5129:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=HorseTransportDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      RegistrationEmail__Mode: Development
      RegistrationEmail__Smtp__Host: "localhost"
      RegistrationEmail__Smtp__Port: "25"
      RegistrationEmail__Smtp__From: "noreply@racehorse.local"
      Jwt__Key: "RaceHorseTransportSecretKey2026_SWP391_Project_SecuredKey_SuperSafe!"
      Flow1__Maps__Geoapify__ApiKey: "${GEOAPIFY_API_KEY:-}"
    volumes:
      - backend_app_data:/app/App_Data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5129/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_app_data:
