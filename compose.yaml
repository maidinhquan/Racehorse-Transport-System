services:
  # =============================================================================
  # 1. DATABASE: MICROSOFT SQL SERVER 2022
  # =============================================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: racehorse-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-14333}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SQL_PASSWORD}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # 2. DB INITIALIZER: TỰ ĐỘNG TẠO BẢNG & SEED DỮ LIỆU TỪ HorseTransportDB.sql
  # =============================================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: racehorse-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"
    volumes:
      - ./HorseTransportDB:/init
    entrypoint: ["/bin/bash", "/init/init-db.sh"]
    restart: "no"

  # =============================================================================
  # 3. BACKEND: ASP.NET CORE 8.0 WEB API & SWAGGER
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: racehorse-backend
    ports:
      - "${BACKEND_PORT:-5129}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=HorseTransportDB;User Id=${SQL_USER};Password=${SQL_PASSWORD};Encrypt=False;TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      RegistrationEmail__Mode: "${REGISTRATION_EMAIL_MODE}"
      RegistrationEmail__Smtp__Host: "${SMTP_HOST}"
      RegistrationEmail__Smtp__Port: "${SMTP_PORT}"
      RegistrationEmail__Smtp__Username: "${SMTP_USERNAME}"
      RegistrationEmail__Smtp__Password: "${SMTP_PASSWORD}"
      RegistrationEmail__Smtp__From: "${SMTP_USERNAME}"
      RegistrationEmail__Smtp__EnableSsl: "true"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # =============================================================================
  # 4. FRONTEND: REACT + VITE + TYPESCRIPT (UI & DOCUMENT WORKFLOW)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: racehorse-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL}"
      API_PROXY_TARGET: "${API_PROXY_TARGET}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
  frontend_node_modules:
