services:
  backend:
    volumes:
      - backend_app_data:/app/App_Data
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5129:8080"
    # Secrets and keys come from .env (not committed). Values under `environment` override env_file,
    # so keys that live in .env are not repeated here.
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:-RaceHorseTransport_SecretJwtKey_MustBeAtLeast32BytesLong_2026!}
      Jwt__Key: ${Jwt__Key:-${JWT_KEY:-RaceHorseTransportSecretKey2026_SWP391_Project_SecuredKey_SuperSafe!}}
      Jwt__Issuer: RaceHorseTransportBackend
      Jwt__Audience: RaceHorseTransportFrontend
      ConnectionStrings__DefaultConnection: "Server=${SQL_SERVER:-racehorse-db,1433};Database=${SQL_DATABASE:-HorseTransportDB};User Id=${SQL_USER:?Set SQL_USER in .env};Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};TrustServerCertificate=True;"
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM:-quangtruong1922@gmail.com}
      Smtp__FromName: ${SMTP_FROM_NAME:-RaceHorse Transport System}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      RegistrationEmail__Mode: ${REGISTRATION_EMAIL_MODE:-Development}
      RegistrationEmail__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      RegistrationEmail__Smtp__Port: ${SMTP_PORT:-587}
      RegistrationEmail__Smtp__Username: ${SMTP_USERNAME:-}
      RegistrationEmail__Smtp__Password: ${SMTP_PASSWORD:-}
      RegistrationEmail__Smtp__From: ${SMTP_FROM:-quangtruong1922@gmail.com}
      RegistrationEmail__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Flow1__Contracts__OtpHmacKey: ${Flow1__Contracts__OtpHmacKey:-RaceHorseTransportFlow1SecretOtpHmacKey2026!}
      Flow1__Maps__Provider: ${Flow1__Maps__Provider:-MAPBOX}
      Flow1__Maps__DataProvider: ${Flow1__Maps__DataProvider:-GEOAPIFY}
      Flow1__Maps__MayPersistResults: ${Flow1__Maps__MayPersistResults:-true}
      Flow1__Maps__Geoapify__ApiKey: ${Flow1__Maps__Geoapify__ApiKey:-167c9593184a44aaa2dc377cea7535f6}
      Flow1__Maps__Geoapify__ApiBaseUrl: ${Flow1__Maps__Geoapify__ApiBaseUrl:-https://api.geoapify.com/}
      Flow1__Maps__Mapbox__AccessToken: ${Flow1__Maps__Mapbox__AccessToken:-pk.eyJ1IjoiaWNld29ybSIsImEiOiJjbXZhY3RyazQwM3k2MndvbWhsN2Fmb29tIn0.20kPK7DHlQJDDbjXdhAQCw}
      Flow1__Maps__Mapbox__PermanentGeocodingEnabled: ${Flow1__Maps__Mapbox__PermanentGeocodingEnabled:-true}
      Flow1__Maps__Mapbox__Attribution: ${Flow1__Maps__Mapbox__Attribution:-© Mapbox © OpenStreetMap}
      Flow1__Vnpay__HashSecret: ${Flow1__Vnpay__HashSecret:-MZDEBQUTSMJCUMKBYBDGFRPHLTVSOEVF}
      Flow1__Contracts__Issuer__COMPANY_NAME: ${Flow1__Contracts__Issuer__COMPANY_NAME:-CÔNG TY CỔ PHẦN VẬN CHUYỂN NGỰA ĐUA QUỐC TẾ CBN}
      Flow1__Contracts__Issuer__COMPANY_ADDRESS: ${Flow1__Contracts__Issuer__COMPANY_ADDRESS:-Số 123 Đường Vận Tải, Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh}
      Flow1__Contracts__Issuer__COMPANY_EMAIL: ${Flow1__Contracts__Issuer__COMPANY_EMAIL:-contact@cbntransport.com}
      Flow1__Contracts__Issuer__COMPANY_HOTLINE: ${Flow1__Contracts__Issuer__COMPANY_HOTLINE:-1900 6868}
      Flow1__Contracts__Issuer__COMPANY_TAX_CODE: ${Flow1__Contracts__Issuer__COMPANY_TAX_CODE:-0312345678}
      Flow1__Contracts__LibreOfficePath: ${Flow1__Contracts__LibreOfficePath:-/usr/bin/soffice}
      Flow1__Contracts__WorkRoot: ${Flow1__Contracts__WorkRoot:-/app/App_Data/flow1/conversion}
      Flow1__PrivateFiles__Root: ${Flow1__PrivateFiles__Root:-/app/App_Data/flow1/private-bytes}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5129/api
    depends_on:
      - backend
    restart: unless-stopped

  # Public HTTPS tunnel so VNPay can call the IPN on this machine (http://backend:8080/api/payments/vnpay/ipn).
  # Starts automatically when .env contains COMPOSE_PROFILES=tunnel plus NGROK_AUTHTOKEN;
  # without them `docker compose up` simply skips it. Register once with VNPay:
  #   https://<your-dev-domain>.ngrok-free.app/api/payments/vnpay/ipn
  # Inspect forwarded requests at http://localhost:4040
  # runs without affecting offline/local compose up when the profile is omitted.
  tunnel:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    # A free ngrok account uses its permanent dev domain automatically (shown at http://localhost:4040
    # and in the ngrok dashboard under Domains), so the IPN URL only has to be registered once.
    command: ["http", "backend:8080", "--log=stdout"]
    profiles:
      - tunnel
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "backend:8080"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    restart: unless-stopped

  # Same purpose without any account (Cloudflare Quick Tunnel): set COMPOSE_PROFILES=quicktunnel.
  # The public URL is random and CHANGES on every restart, so the VNPay IPN URL must be updated each time.
  # Current URL: open http://localhost:2000/quicktunnel  (or: docker compose logs quicktunnel)
  quicktunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["quicktunnel"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://backend:8080"]
    ports:
      - "2000:2000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_app_data:
