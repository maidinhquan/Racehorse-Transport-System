<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
 <match target="pattern"><test name="family" compare="eq"><string>Times New Roman</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit></match>
 <match target="pattern"><test name="family" compare="eq"><string>Arial</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
 <match target="pattern"><test name="family" compare="eq"><string>Calibri</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans</string></edit></match>
</fontconfig>
