services:
  backend:
    volumes:
      - backend_app_data:/app/App_Data
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5129:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=HorseTransportDB;User Id=${SQL_USER:?Set SQL_USER in .env};Password=${SQL_PASSWORD:?Set SQL_PASSWORD in .env};TrustServerCertificate=True;"
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-RaceHorse Transport System}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      RegistrationEmail__Mode: ${REGISTRATION_EMAIL_MODE:-Development}
      RegistrationEmail__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      RegistrationEmail__Smtp__Port: ${SMTP_PORT:-587}
      RegistrationEmail__Smtp__Username: ${SMTP_USERNAME:-}
      RegistrationEmail__Smtp__Password: ${SMTP_PASSWORD:-}
      RegistrationEmail__Smtp__From: ${SMTP_FROM:-}
      RegistrationEmail__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5129/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_app_data:
  frontend_node_modules:
